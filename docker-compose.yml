version: '3.8'

services:
  init-ssl:
    image: certbot/certbot
    container_name: proxmox-billing-init-ssl
    ports:
      - "80:80"
    volumes:
      - ssl-certs:/etc/nginx/ssl
      - ./docker/init-ssl.sh:/init-ssl.sh:ro
    environment:
      DOMAIN: ${DOMAIN}
      EMAIL: ${EMAIL}
    entrypoint: /bin/sh
    command: /init-ssl.sh
    restart: "no"
    networks:
      - billing-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: proxmox-billing-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./uploads:/var/www/html/uploads:ro
      - ssl-certs:/etc/nginx/ssl
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      apache:
        condition: service_started
      init-ssl:
        condition: service_completed_successfully
    networks:
      - billing-network
    restart: unless-stopped

  apache:
    build:
      context: .
      dockerfile: Dockerfile.apache
    container_name: proxmox-billing-apache
    volumes:
      - ./uploads:/var/www/html/uploads
      - ./logs:/var/www/html/logs
      - ./backups:/var/www/html/backups
      - ./backups/archives:/var/www/html/admin/backups
      - ./docker/proxmox-tls:/etc/proxmox-tls:ro
      - ${HOMEVLAD_LICENSE_DIR:-./.docker-private/license}:/run/homevlad-license:ro
      - panel-private:/var/lib/homevlad-private
      - ./docker/apache/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
    #  - .:/var/www/html
    environment:
      CONSOLE_ORIGIN: https://${DOMAIN}
      HOMEVLAD_ENABLE_INSTALL: ${HOMEVLAD_ENABLE_INSTALL:-0}
      HOMEVLAD_PUBLIC_URL: https://${DOMAIN}
      CONSOLE_BIND: 0.0.0.0
      HOMEVLAD_UPDATE_PUBLIC_KEY: ${HOMEVLAD_UPDATE_PUBLIC_KEY:-}
      HOMEVLAD_LICENSE_CONFIG: ${HOMEVLAD_LICENSE_CONFIG:-}
      HOMEVLAD_CONSOLE_SETTINGS: /var/lib/homevlad-private/console/settings.json
      PROXMOX_CA_FILE: ${PROXMOX_CA_FILE:-}
      PROXMOX_CERT_PINS: ${PROXMOX_CERT_PINS:-}
      PROXMOX_NODE_KEY: ${PROXMOX_NODE_KEY:-}
      PROXMOX_TOKEN_CANDIDATE_DIR: /var/www/html/backups/token-candidates
      PROXMOX_GUEST_LOCK_DIR: /var/www/html/backups/guest-locks
      DB_HOST: db
      HOMEVLAD_BACKUP_DB_LOCAL: ${HOMEVLAD_BACKUP_DB_LOCAL:-1}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - billing-network
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: proxmox-billing-db

    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - billing-network

  certbot-renew:
    image: certbot/certbot
    container_name: proxmox-billing-certbot-renew
    volumes:
      - ./webroot:/var/www/html
      - ./docker/ssl:/etc/letsencrypt
      - ssl-certs:/etc/nginx/ssl
    environment:
      DOMAIN: ${DOMAIN}
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/html --quiet; sleep 12h & wait $${!}; done;"
    depends_on:
      - nginx
    networks:
      - billing-network
    restart: unless-stopped

volumes:
  db_data:
  panel-private:
  ssl-certs:

networks:
  billing-network:
    driver: bridge
