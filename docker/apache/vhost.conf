<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Runtime data must never be served as public web content.
    <Directory /var/www/html/logs>
        Require all denied
    </Directory>
    <Directory /var/www/html/backups>
        Require all denied
    </Directory>

    # Uploaded files may be downloaded, but never executed as PHP.
    <Directory /var/www/html/uploads>
        Options -Indexes -ExecCGI -FollowSymLinks
        <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|pht)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>