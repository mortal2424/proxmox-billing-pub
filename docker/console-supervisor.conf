[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid

[program:apache]
command=/usr/local/bin/apache2-foreground
stopasgroup=true
killasgroup=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:console]
command=/usr/bin/python3 /opt/homevlad-console/bridge.py
user=www-data
umask=0077
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cloud-image-imports]
command=/usr/local/bin/cron-scheduler.sh cloud-images
user=www-data
umask=0077
stopasgroup=true
killasgroup=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:licensing-refresh]
command=/bin/sh -c 'while true; do /usr/local/bin/php /var/www/html/cronjobs/refresh_license.php; sleep 300; done'
user=www-data
umask=0077
stopasgroup=true
killasgroup=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
