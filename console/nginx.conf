location = /console/socket {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_read_timeout 75s;
    access_log off;
}
location = /console/view.html {
    root /home/mortal/web/homevlad.ru/public_html;
    add_header Cache-Control "no-store";
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://homevlad.ru; img-src 'self' data:; frame-ancestors 'self'; base-uri 'none'";
}
location = /console/view.js {
    root /home/mortal/web/homevlad.ru/public_html;
}
location ^~ /console/assets/ {
    root /home/mortal/web/homevlad.ru/public_html;
}
location ^~ /console/ { return 404; }
