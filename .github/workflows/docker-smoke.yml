name: Docker smoke
on:
  workflow_dispatch:
  push:
    branches: [main, codex/docker-console-updater, codex/docker-backup-recovery, 'codex/release-beta*']
  pull_request:
    paths:
      - '.github/workflows/docker-smoke.yml'
      - 'Dockerfile.*'
      - 'docker-compose.yml'
      - 'docker/**'
      - 'console/**'
      - 'includes/console_*.php'
      - 'includes/update_*.php'
      - 'admin/update.php'
      - 'admin/ajax_apply_update.php'
      - 'tools/docker-smoke*'
      - 'tools/docker-backup-smoke*'
      - 'includes/backup_*.php'
      - 'admin/backup*.php'
      - 'cronjobs/*backup*.php'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.ref_name != 'codex/docker-backup-recovery'
        run: bash tools/docker-smoke.sh
      - run: bash tools/docker-smoke.sh backup
