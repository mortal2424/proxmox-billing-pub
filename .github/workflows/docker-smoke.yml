name: Docker smoke
on:
  workflow_dispatch:
  push:
    branches: [codex/docker-console-updater]
  pull_request:
    paths:
      - '.github/workflows/docker-smoke.yml'
      - 'Dockerfile.*'
      - 'docker-compose.yml'
      - 'docker/**'
      - 'console/**'
      - 'includes/console_*.php'
      - 'includes/update_*.php'
      - 'admin/update.php'
      - 'admin/ajax_apply_update.php'
      - 'tools/docker-smoke*'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash tools/docker-smoke.sh
